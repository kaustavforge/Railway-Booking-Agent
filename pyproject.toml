[project]
name = "railway-booking"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # LangChain / LangGraph
    "langchain-groq",
    "langgraph==0.2.66",
    "langchain-core",
    "langchain-community",
    "fastembed",
    "langchain-text-splitters",
    "langchain-pinecone",
    "langgraph-checkpoint-postgres",
    # Vector & Embeddings
    "pinecone",
    "faiss-cpu",
    # Database
    "psycopg2-binary",
    # PDF & Data
    "reportlab",
    "qrcode",
    "pillow",
    "pypdf",
    "pandas",
    # API
    "fastapi",
    "uvicorn[standard]",
    # Config
    "python-dotenv",
]

[tool.setuptools]
py-modules = []
packages = []
